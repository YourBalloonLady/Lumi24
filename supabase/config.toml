# Stripe calls this endpoint without a Supabase login token.
# The function checks the Stripe signature instead.

[functions.stripe-payment-link-webhook]
verify_jwt = false

# Admin calls this with the signed-in owner token. The function rejects every
# other caller. Stripe does not call it directly.
[functions.order-paid-effects]
verify_jwt = true

# The database calls this after an order is inserted. It checks a vault secret
# instead of a Supabase login token, and messages only the admin chat.
[functions.notify-admin-new-order]
verify_jwt = false
