<!doctype html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="/lumina-favicon.png?v=1">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reset Password | Lumina</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body{font-family:system-ui;padding:24px;max-width:520px;margin:0 auto}
    input,button{width:100%;padding:12px;margin:8px 0;font-size:16px}
    button:disabled{opacity:.65;cursor:not-allowed}
  </style>
</head>
<body>
  <h1>Reset your password</h1>
  <p id="status" role="status">Opening reset session…</p>

  <form id="form" style="display:none;">
    <label for="pw1">New password</label>
    <input id="pw1" type="password" autocomplete="new-password" placeholder="8+ characters with upper, lower, number and symbol" required minlength="8" />
    <label for="pw2">Confirm new password</label>
    <input id="pw2" type="password" autocomplete="new-password" placeholder="Confirm new password" required minlength="8" />
    <button id="submitButton" type="submit">Set new password</button>
  </form>

  <script>
    const SUPABASE_URL = "https://qketnqhfjfxbqiuqevnh.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrZXRucWhmamZ4YnFpdXFldm5oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ2NjkzMzAsImV4cCI6MjA4MDI0NTMzMH0.JIrgLIwWIA5Gwu9K4BsgS0Y_jyax2G6irqkaf35aPys";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { detectSessionInUrl: true, persistSession: true }
    });

    const statusEl = document.getElementById("status");
    const form = document.getElementById("form");
    const submitButton = document.getElementById("submitButton");

    function showPasswordForm() {
      statusEl.textContent = "Enter a new password:";
      form.style.display = "block";
    }

    async function init() {
      const url = new URL(window.location.href);
      const code = url.searchParams.get("code");

      if (code) {
        const { error } = await supabaseClient.auth.exchangeCodeForSession(code);
        if (error) {
          statusEl.textContent = "This reset link is invalid or has expired. Please request a new one.";
          return;
        }
      }

      const { data, error } = await supabaseClient.auth.getSession();
      if (error || !data.session) {
        statusEl.textContent = "No reset session was found. Please use the latest link from your reset email.";
        return;
      }

      showPasswordForm();
    }

    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY" && session) showPasswordForm();
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const password = document.getElementById("pw1").value;
      const confirmation = document.getElementById("pw2").value;

      if (!/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}$/.test(password)) {
        statusEl.textContent = "Use at least 8 characters including uppercase, lowercase, a number and a symbol.";
        return;
      }

      if (password !== confirmation) {
        statusEl.textContent = "Passwords do not match.";
        return;
      }

      submitButton.disabled = true;
      statusEl.textContent = "Updating your password…";

      const { error } = await supabaseClient.auth.updateUser({ password });
      if (error) {
        statusEl.textContent = "Password could not be updated: " + error.message;
        submitButton.disabled = false;
        return;
      }

      statusEl.textContent = "Password updated. Redirecting you to sign in…";
      await supabaseClient.auth.signOut();
      window.location.replace("/account.html");
    });

    init();
  </script>
  <script src="/site-nav.js"></script>
</body>
</html>
